name: Build Jivan Pawar Calculator APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check calculator file
        run: |
          test -s index.html
          grep -q "Jivan Pawar" index.html

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install image library
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install Pillow

      - name: Generate Android app
        shell: bash
        run: |
          mkdir -p app/src/main/assets app/src/main/java/com/jivanpaw/calculator
          mkdir -p app/src/main/res/values
          cp index.html app/src/main/assets/index.html

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "JivanPawarCalculator"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.jivanpaw.calculator'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.jivanpaw.calculator'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="Jivan Pawar Calculator"
                  android:theme="@style/AppTheme"
                  android:icon="@mipmap/ic_launcher">
                  <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:colorAccent">#FFD12E</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/jivanpaw/calculator/MainActivity.kt <<'EOF'
          package com.jivanpaw.calculator

          import android.app.Activity
          import android.os.Bundle
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.webkit.WebChromeClient
          import android.webkit.WebSettings
          import android.webkit.JavascriptInterface
          import android.print.PrintAttributes
          import android.print.PrintManager
          import android.content.Intent

          class MainActivity : Activity() {
              private lateinit var web: WebView
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = android.graphics.Color.BLACK
                  window.navigationBarColor = android.graphics.Color.BLACK
                  web = WebView(this)
                  web.setBackgroundColor(android.graphics.Color.BLACK)
                  web.settings.javaScriptEnabled = true
                  web.settings.domStorageEnabled = true
                  web.settings.allowFileAccess = true
                  web.settings.cacheMode = WebSettings.LOAD_DEFAULT
                  web.addJavascriptInterface(Bridge(), "AndroidApp")
                  web.webChromeClient = WebChromeClient()
                  web.webViewClient = object : WebViewClient() {
                      override fun onPageFinished(view: WebView?, url: String?) {
                          view?.evaluateJavascript("window.print=function(){AndroidApp.printPage();};", null)
                      }
                  }
                  setContentView(web)
                  web.loadUrl("file:///android_asset/index.html")
              }
              inner class Bridge {
                  @JavascriptInterface fun printPage() {
                      runOnUiThread {
                          val manager = getSystemService(PRINT_SERVICE) as PrintManager
                          manager.print("Jivan Pawar Financial Report",
                              web.createPrintDocumentAdapter("Jivan Pawar Report"),
                              PrintAttributes.Builder().build())
                      }
                  }
                  @JavascriptInterface fun shareText(value: String) {
                      runOnUiThread {
                          val send = Intent(Intent.ACTION_SEND).apply {
                              type = "text/plain"
                              putExtra(Intent.EXTRA_TEXT, value)
                          }
                          startActivity(Intent.createChooser(send, "Share report"))
                      }
                  }
              }
              @Deprecated("Deprecated in Android")
              override fun onBackPressed() {
                  if (::web.isInitialized && web.canGoBack()) web.goBack() else super.onBackPressed()
              }
          }
          EOF

          # Use an embedded website favicon when available; otherwise create a simple branded icon.
          python3 - <<'PY'
          import re, base64, io, os
          from PIL import Image, ImageDraw
          html = open("index.html", encoding="utf-8").read()
          match = re.search(r'<link[^>]*rel=["\'](?:shortcut )?icon["\'][^>]*href=["\']data:image/[^;]+;base64,([^"\']+)', html, re.I)
          icon = None
          if match:
              try:
                  icon = Image.open(io.BytesIO(base64.b64decode(match.group(1)))).convert("RGBA")
              except Exception:
                  pass
          if icon is None:
              icon = Image.new("RGBA", (512, 512), "#050505")
              d = ImageDraw.Draw(icon)
              d.ellipse((12, 12, 500, 500), outline="#ffd12e", width=18)
              d.text((205, 225), "JP", fill="#ffd12e")
          for folder, size in [("mdpi",48),("hdpi",72),("xhdpi",96),("xxhdpi",144),("xxxhdpi",192)]:
              out = f"app/src/main/res/mipmap-{folder}"
              os.makedirs(out, exist_ok=True)
              icon.resize((size,size), Image.Resampling.LANCZOS).save(out + "/ic_launcher.png")
          PY

          gradle wrapper --gradle-version 8.9

      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jivan-Pawar-Calculator-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
