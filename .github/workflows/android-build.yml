name: Build Jivan Pawar Calculator APK

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare Android app from index.html
        run: |
          test -f index.html || { echo "ERROR: index.html is missing from the repository root."; exit 1; }

          mkdir -p www
          cp index.html www/index.html

          cat > package.json <<'EOF'
          {
            "name": "jivan-pawar-calculator",
            "version": "1.0.0",
            "private": true,
            "description": "Jivan Pawar Calculator Android application",
            "dependencies": {
              "@capacitor/core": "^7.0.0",
              "@capacitor/android": "^7.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.0.0"
            }
          }
          EOF

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.jivanpaw.calculator",
            "appName": "Jivan Pawar Calculator",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

          npm install
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jivan-Pawar-Calculator-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
